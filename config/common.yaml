# operation config
default_hostname: "127.0.0.1"
default_robot_port: 6001
control_hz: 500
touch_ee_pose_topic:  "/touch/tip_pose"
touch_button_topic: "/touch/button"
touch_force_feedback_topic: "/touch/force_feedback"
controller_type: "cartesian_compliance_controller" # "joint_trajectory_controller" or "cartesian_compliance_controller"
compliance_control_wrench_zero_service: "/wrench/filtered/zero_ftsensor"
feedback_wrench_topic: "/leptrino/wrench/filtered"
feedback_wrench_zero_service: "/leptrino/wrench/filtered/zero_ftsensor"
teleoperation_mode: "bilateral" # "unilateral" or "bilateral"
use_gripper: False
use_FT_sensor: True
touch_max_force: 3.3
force_scale_to_touch: 0.8


# camera config
default_camera_port: 7001 # If there are multiple cameras, use consecutive numbers
camera_names: ["bottom"] # "base" or "side" or "bottom"
camera_width: 640
camera_height: 480
camera_fps: 60

# imitation learning config
task_name: "cup_push"
save_episode_dir: "/root/onolab/catkin_ws/src/gello_software/gello_ros/scripts/episode_data"
eval_ckpt_dir: "/root/onolab/catkin_ws/src/gello_software/gello_ros/scripts/checkpoints/20241202_185808_cup_push"
number_of_episodes: 5 # trials
number_of_steps: 10000 # steps for each episode
state_dim: 6
action_dim: 6
